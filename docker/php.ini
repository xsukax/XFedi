; Leave private files outside the document root. Never expose PHP warnings to visitors.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 40
memory_limit = 128M
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
allow_url_fopen = Off
