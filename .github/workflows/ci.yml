name: XFedi checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl, mbstring, dom, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and application checks
        run: ./tests/run.sh
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check origin isolation
        run: |
          cp .env.example .env
          sed -i -e 's/social.example.com/social.example/' -e 's/LOCAL_PORT=80/LOCAL_PORT=8080/' .env
          docker compose config --quiet
          docker compose build php
          docker compose up -d --wait
          ./verify.sh
          docker compose exec -T web caddy validate --config /etc/caddy/Caddyfile
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
